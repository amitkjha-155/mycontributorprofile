<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <!-- header starts here -->
    <header>
        <h1 align = "center">TechFest 2026</h1>
        <img src="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcQtkCoysgn8GTmed8-zCR5prvy48hqQ9bFMA_xAimqAGA&s=10" alt="newyear image">
    </header>
    <!-- header ends here -->
    <!-- user details section starts here -->
    <form action="#">
        <label for="Name">Name</label>
        <input type="text" name = "Name" id="Name" placeholder="Enter Your Name" required> <br>
        <label for="Email">Email</label>
        <input type="email" name = "Email" id="Email" placeholder="Enter Your Email" required> <br>
        <label for="Phone-No">Phone No:</label>
        <input type="tel" name = "Phone-no" id="Phone No:" placeholder="Enter Your Phone No:" required> <br>
        <label for="Gender">Gender</label>
        <input type="radio" name = "Gender" id="Gender"> Male <br>
        <input type="radio" name = "Gender" id="Gender"> Female<br>
        <label for="DOB">DOB</label>
        <input type="date" name = "DOB" id="DOB" placeholder="Enter Your DOB" required> <br>
        <label for="file">file</label>
        <input type="file" name = "file" id="file" placeholder="Enter Payment Proof" required> <br>
        <label for="Address">Address</label>
        <!-- <input type="text" Address = "Name" id="Address" placeholder="Enter Your Address" required> -->
        <textarea name="Address" id="Address"></textarea> <br>
        <button>Submit</button>
    </form>
     <!-- user details section ends here -->
    
</body>
